<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080a08"><meta name="robots" content="noindex,nofollow">
<title>BALI PHOTO WALL · LED</title>
<link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script>
</head>
<body data-page="screen">
<div class="screen">
  <div class="screen-login" id="screenLogin">
    <form id="screenLoginForm" class="screen-login-card">
      <img src="/bali-night-club-logo.svg" class="login-brand" alt="BALI Night Club">
      <h2>ПОДКЛЮЧЕНИЕ LED-ЭКРАНА</h2>
      <p>Введите пароль оператора экрана. Фотографии доступны только после входа.</p>
      <input class="field" id="screenPassword" type="password" autocomplete="current-password" placeholder="Пароль экрана" required>
      <button class="button primary" type="submit">ЗАПУСТИТЬ ФОТОСТЕНУ</button>
      <div class="alert" role="status" id="screenLoginMessage"></div>
    </form>
  </div>

  <div class="screen-center photo-wall" id="screenCenter" aria-label="Одобренные фотографии текущего мероприятия">
    <div class="screen-placeholder"><div class="line">ПОДЕЛИСЬ <span class="glow">МОМЕНТОМ</span></div><p>Твои фотографии на экранах BALI</p></div>
  </div>
  <div class="screen-top"><img class="screen-logo" id="screenLogo" src="/bali-night-club-logo.svg" alt="BALI Night Club"></div>
  <div class="screen-bottom">
    <div class="screen-event" id="screenEvent">BALI NIGHT CLUB</div>
    <div class="qr-wrap" id="screenQr"><img src="/qr.svg" alt="QR-код для загрузки фотографий"><small>ЗАГРУЗИ ФОТО</small></div>
  </div>
  <div class="screen-actions">
    <button class="screen-control" id="fullscreenBtn" type="button" title="Полный экран" aria-label="Полный экран">⛶</button>
    <button class="screen-control" id="settingsBtn" type="button" title="Настройки фотостены" aria-label="Открыть настройки фотостены" aria-expanded="false" aria-controls="wallSettings">⚙</button>
  </div>
  <aside class="wall-settings" id="wallSettings" hidden aria-label="Настройки показа">
    <div class="settings-head"><h2>НАСТРОЙКИ ЭКРАНА</h2><button class="settings-close" id="settingsClose" type="button" aria-label="Закрыть настройки">✕</button></div>
    <p class="settings-caption">Применяются сразу и сохраняются только в браузере этого экрана.</p>
    <label>Максимум фотографий одновременно <input id="wallLimit" type="number" min="1" max="500" step="1"></label>
    <label>Расположение
      <select id="wallLayout"><option value="auto">Автоматическая сетка</option><option value="manual">Указать число колонок</option></select>
    </label>
    <label id="wallColumnsGroup" hidden>Колонок <input id="wallColumns" type="number" min="1" max="50"></label>
    <label>Промежуток между фото: <output id="wallGapValue"></output>
      <input id="wallGap" type="range" min="0" max="24" step="1">
    </label>
    <label>Отображение снимков
      <select id="wallFit"><option value="cover">Заполнить ячейку (обрезка краёв)</option><option value="contain">Показать полностью (поля)</option></select>
    </label>
    <label class="settings-check"><input id="wallQr" type="checkbox"> Показывать QR-код</label>
    <label>Размер QR-кода: <output id="wallQrSizeValue"></output>
      <input id="wallQrSize" type="range" min="50" max="180" step="5">
    </label>
    <label class="settings-check"><input id="wallLogo" type="checkbox"> Показывать логотип</label>
    <label>Ширина логотипа: <output id="wallLogoSizeValue"></output>
      <input id="wallLogoSize" type="range" min="100" max="340" step="10">
    </label>
    <div class="settings-foot"><span id="wallCount" role="status">0 фотографий</span><button id="wallReset" class="button secondary" type="button">СБРОСИТЬ НАСТРОЙКИ</button></div>
  </aside>
</div>
</body>
</html>
